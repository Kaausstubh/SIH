  <path d="M 26 23 Q 45 16 66 26 L 62 33 Q 48 27 30 31 Z" fill="url(#nk-feather-dark)"/>
  <path d="M 18 34 Q 38 29 58 37 L 54 44 Q 38 39 20 42 Z" fill="url(#nk-feather-dark)"/>
  <path d="M 33 17 Q 52 12 70 23 C 65 25 56 26 48 24 Q 40 22 33 17 Z" fill="url(#nk-feather-gold)" stroke="#92400E" stroke-width="0.6"/>
  <path d="M 24 25 Q 46 20 64 30 C 58 32 50 33 42 31 Q 32 29 24 25 Z" fill="url(#nk-feather-gold)" stroke="#92400E" stroke-width="0.6"/>

