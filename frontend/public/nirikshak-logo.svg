  <path d="M 44 58 C 48 66 54 74 63 80 C 53 78 46 72 38 66 Z" fill="url(#nk-feather-gold)" stroke="#92400E" stroke-width="0.6"/>

  <!-- Mini Chakra & Plaque -->
  <circle cx="36" cy="81" r="7" fill="#0A1E3F" stroke="url(#nk-gold-rim)" stroke-width="1.2"/>
  <circle cx="36" cy="81" r="1.5" fill="#F59E0B"/>
  <path d="M 46 82 L 76 82 L 72 90 L 46 90 Z" fill="url(#nk-gold-rim)" stroke="#78350F" stroke-width="0.6"/>
  <text x="59" y="88.2" text-anchor="middle" fill="#060C18" font-size="5.2" font-weight="900" font-family="sans-serif">निरीक्षक</text>
