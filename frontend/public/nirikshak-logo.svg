  <path d="M 50 3 L 89 17 C 89 54 75 81 50 97 C 25 81 11 54 11 17 Z" fill="url(#nk-shield-bg)" stroke="url(#nk-gold-rim)" stroke-width="2.8"/>
  <path d="M 50 7.5 L 85 20 C 85 52 72 76 50 91 C 28 76 15 52 15 20 Z" fill="none" stroke="url(#nk-gold-rim)" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M 22 19 L 50 8 L 78 19" stroke="url(#nk-saffron)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 30 83 Q 50 89 70 83" stroke="url(#nk-green)" stroke-width="2.2" stroke-linecap="round"/>

